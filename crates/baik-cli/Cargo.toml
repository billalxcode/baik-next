[package]
name = "baik-cli"
version = "10.0.0"
edition = "2021"
description = "BAIK CLI binary for .ina files. Replaces tbaik.c."
authors = ["anak10thn <anak10thn@gmail.com>"]
license = "MIT"

[[bin]]
name = "baik-next"
path = "src/main.rs"

[dependencies]
baik-interp = { path = "../baik-interp" }
baik-value = { path = "../baik-value" }
clap = { version = "4", features = ["derive"] }
